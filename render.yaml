# ===================================================================
# CoalGuard AI - Render Infrastructure as Code Blueprint (render.yaml)
# Automated multi-service deployment for:
# 1. Render PostgreSQL Database
# 2. Render Python FastAPI Web Service (Backend)
# 3. Render React + Vite Static Site (Frontend)
# ===================================================================

version: "1"

databases:
  - name: coalguard-postgres
    databaseName: coalguard_ai
    user: coalguard_admin
    plan: free
    region: oregon

services:
  # -----------------------------------------------------------------
  # 1. FastAPI Web Service (Python Backend Engine)
  # -----------------------------------------------------------------
  - type: web
    name: coalguard-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coalguard-postgres
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: coalguard-frontend
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ENVIRONMENT
        value: production

  # -----------------------------------------------------------------
  # 2. React + Vite Static Site (Frontend Portal)
  # -----------------------------------------------------------------
  - type: web
    name: coalguard-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: coalguard-api
          property: host
