version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: coalguard_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: coalguard_ai
      MYSQL_USER: coalguard_user
      MYSQL_PASSWORD: coalguard_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # FastAPI Backend & AI Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coalguard_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://coalguard_user:coalguard_secure_password@mysql:3306/coalguard_ai
      JWT_SECRET: coalguard-production-super-secret-key-sih-2026-secure
      CORS_ORIGINS: http://localhost,http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  # React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coalguard_frontend
    restart: always
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
